name: Module Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Tests and dependency audit (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn npm audit --all --recursive
